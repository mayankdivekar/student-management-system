
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>StudentHub</h2>

        <nav>
            <a href="#" class="active">Dashboard</a>
            <a href="#students">Students</a>
        </nav>

        <p class="sidebar-footer">Student Management System</p>
    </div>

    <main class="main-content">

        <header>
            <div>
                <h1>Dashboard</h1>
                <p>Manage your students easily</p>
            </div>

            <button id="addStudentBtn">+ Add Student</button>
        </header>

        <section class="stats">
            <div class="stat-card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="stat-card">
                <h3>Total Courses</h3>
                <h2 id="totalCourses">0</h2>
            </div>
        </section>

        <section class="student-section" id="students">

            <div class="section-header">
                <h2>Student Records</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search students..."
                >
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>
            </table>

            <p id="emptyMessage">No students found.</p>

        </section>

    </main>

    <!-- Add / Edit Student Form -->

    <div class="modal" id="studentModal">

        <div class="modal-content">

            <h2 id="modalTitle">Add New Student</h2>

            <form id="studentForm">

                <input type="text" id="name"
                    placeholder="Student Name" required>

                <input type="email" id="email"
                    placeholder="Email Address" required>

                <input type="text" id="course"
                    placeholder="Course" required>

                <input type="number" id="age"
                    placeholder="Age" min="1" required>

                <div class="form-buttons">
                    <button type="submit">Save Student</button>
                    <button type="button" id="closeModal">Cancel</button>
                </div>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
